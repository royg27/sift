<script>window.SIFT_IDEAS = [{"id":"scout-mindset","title":"The trick is wanting to be wrong","kicker":"A better way to think","hook":"What if changing your mind felt like winning instead of losing?","type":"Book","category":"Psychology","author":"Julia Galef","source_title":"The Scout Mindset","source_url":"https://www.penguinrandomhouse.com/books/555240/the-scout-mindset-by-julia-galef/","year":2021,"minutes":3,"art":"sage","summary":"A scout tries to see the terrain accurately. A soldier tries to defend a position. The distinction offers a useful way to catch motivated reasoning.","body":["When we argue, we often behave as though our beliefs are territory to protect. We search for supportive evidence and find ingenious reasons to dismiss inconvenient facts.","Julia Galef proposes a different identity: the scout. The scout's reward is an increasingly accurate map of reality, even if that means admitting an earlier view was wrong.","This is not the same as having no convictions. It means choosing beliefs based on what the evidence supports and making updates less emotionally costly."],"takeaways":["Notice whether you're investigating a claim or defending it.","Ask what evidence would genuinely change your mind.","Treat a corrected belief as progress, not defeat."],"nuance":"This is a conceptual framework from a book, not a guarantee that people can eliminate bias by attitude alone.","application":"Pick one opinion you hold strongly. Write down one observation that would make you less confident in it.","quiz":{"question":"Which question best reflects a scout mindset?","choices":["How do I prove my side is right?","What evidence could change my view?","Who agrees with me?"],"answer":1,"explanation":"A scout searches for an accurate picture, including evidence that could overturn a favored belief."}},{"id":"psychology-money","title":"Being good with money is not just about math","kicker":"The hidden side of wealth","hook":"The financially optimal choice can be the wrong choice for a human being.","type":"Book","category":"Economics","author":"Morgan Housel","source_title":"The Psychology of Money","source_url":"https://www.harriman-house.com/psychologyofmoney","year":2020,"minutes":3,"art":"peach","summary":"Financial success depends on behavior, uncertainty and personal circumstances, not simply on knowing the right formulas.","body":["Two people can see the same numbers and make very different decisions because their lived experiences with risk are different.","Housel emphasizes that staying in the game is often more valuable than squeezing out every possible return. Plans that look optimal on a spreadsheet can fail if they require a person to endure a level of volatility they cannot tolerate.","That shifts the question from 'What maximizes the expected outcome?' to 'What strategy can I realistically stick with?'"],"takeaways":["A sustainable plan can outperform an optimal plan that you abandon.","Risk tolerance is personal and shaped by experience.","Room for error is a feature, not wasted efficiency."],"nuance":"These are themes of the book, not individualized financial advice or a claim that risk can be eliminated.","application":"Think of a recent financial decision. Separate what was mathematically attractive from what you could comfortably sustain.","quiz":{"question":"Why might a less aggressive plan be more effective over time?","choices":["It always has a higher return","It may be easier to maintain through uncertainty","It eliminates losses"],"answer":1,"explanation":"A plan that survives real behavior and difficult periods can be more useful than a theoretically optimal but unsustainable one."}},{"id":"atomic-habits","title":"Your environment is a silent decision-maker","kicker":"Small changes, big consequences","hook":"Changing what is easy to do can matter more than trying harder.","type":"Book","category":"Psychology","author":"James Clear","source_title":"Atomic Habits","source_url":"https://jamesclear.com/books","year":2018,"minutes":3,"art":"lavender","summary":"Habits are shaped by cues and friction. Designing an environment can make a desired behavior more likely without relying entirely on motivation.","body":["An intention to read every evening is fragile if the book is hidden and the phone is always within reach.","A central idea in Atomic Habits is to make desired actions obvious and easy, and make unwanted ones less convenient. Moving the book to the pillow and charging the phone outside the bedroom changes the choice architecture.","The strategy works through repeated, ordinary moments rather than heroic acts of discipline."],"takeaways":["Make desired behaviors visible and low-friction.","Raise the friction of habits you want to reduce.","Small repeated actions can compound over time."],"nuance":"Environmental design helps but does not resolve every barrier to behavior change.","application":"For one habit you want, change a single physical cue today instead of writing another goal.","quiz":{"question":"Which intervention best uses environmental design?","choices":["Promise to use more willpower","Put running shoes by the door","Set a more ambitious target"],"answer":1,"explanation":"A visible cue lowers the friction for starting the desired behavior."}},{"id":"range-generalists","title":"Why wandering can be a competitive advantage","kicker":"The case for range","hook":"In messy domains, an indirect path can teach you more than an early straight line.","type":"Book","category":"Ideas","author":"David Epstein","source_title":"Range: Why Generalists Triumph in a Specialized World","source_url":"https://www.penguinrandomhouse.com/books/550188/range-by-david-epstein/","year":2019,"minutes":4,"art":"blue","summary":"Some complex, unpredictable fields reward broad exploration and transfer of ideas across disciplines, challenging the assumption that early specialization is always best.","body":["Practice in a predictable environment lets people learn stable patterns. But many real-world problems are less regular: goals shift, feedback is ambiguous, and yesterday's rules may not hold tomorrow.","David Epstein argues that experience across multiple fields can help people build analogies and transfer useful strategies from one context to another.","The message is not that specialists are unnecessary. It is that breadth can be strategically valuable, especially when you do not yet know which problems matter most."],"takeaways":["Broad sampling can reveal unexpected interests and skills.","Analogies across fields can unlock unfamiliar problems.","Whether to specialize depends partly on how predictable the domain is."],"nuance":"The book advances an argument spanning many examples; it does not establish that generalists outperform specialists in every setting.","application":"Ask which tool from an unrelated field might illuminate a stubborn problem you are working on.","quiz":{"question":"Where might broad experience be especially useful?","choices":["In changing, poorly structured problems","In every task without exception","Only in beginner-level work"],"answer":0,"explanation":"Transfer and analogy can help when a domain has uncertain rules and unclear feedback."}},{"id":"makers-schedule","title":"One meeting can cost more than one hour","kicker":"The economics of focus","hook":"Some work isn't divisible into neat calendar blocks.","type":"Essay","category":"Work","author":"Paul Graham","source_title":"Maker's Schedule, Manager's Schedule","source_url":"https://paulgraham.com/makersschedule.html","year":2009,"minutes":3,"art":"yellow","summary":"A meeting that looks small on a manager's calendar may fragment the uninterrupted blocks a maker needs to do difficult work.","body":["For people coordinating other people, hour-long blocks can be useful. A meeting fills a slot, and the day keeps moving.","Writing code, doing research or composing a complex argument often has a different rhythm. It can require hours of continuous attention and substantial ramp-up time.","Graham's point is that two working styles have different interruption costs. Grouping meetings together can protect deep-work periods without banning collaboration."],"takeaways":["Calendar time and cognitive cost are not equivalent.","Complex creation often benefits from large uninterrupted blocks.","Batch meetings to minimize fragmentation."],"nuance":"This is an essay and a useful mental model, not a controlled study quantifying meeting costs.","application":"Try clustering meetings at one end of a day and protecting one long block for your hardest task.","quiz":{"question":"What is the hidden cost of a mid-afternoon meeting for a maker?","choices":["Only the meeting duration","Potentially fragmenting a long focus period","The cost of the meeting room"],"answer":1,"explanation":"The disruption can prevent starting or sustaining cognitively demanding work."}},{"id":"great-work","title":"Curiosity can be a research strategy","kicker":"Finding important problems","hook":"Sometimes the interesting thing that seems like a distraction is the point.","type":"Essay","category":"Ideas","author":"Paul Graham","source_title":"How to Do Great Work","source_url":"https://paulgraham.com/greatwork.html","year":2023,"minutes":4,"art":"mint","summary":"Following genuine curiosity, exploring neglected questions and iterating on small experiments can help uncover consequential work.","body":["An important problem is not always labeled important at the beginning. Sometimes it starts as a question that keeps bothering one person.","Paul Graham argues that doing great work often involves finding where your interests and abilities meet, approaching the frontier, noticing gaps and exploring them.","Instead of demanding a complete roadmap, a small prototype or experiment can reveal what the next step ought to be."],"takeaways":["Serious work can begin as a seemingly frivolous question.","Look for gaps and anomalies at the edge of what you know.","Try small experiments and let findings guide the next step."],"nuance":"The essay is practical reflection rather than a universal, experimentally validated recipe.","application":"Write down one question you have been curious about but dismissing as unimportant. What is the smallest way to investigate it?","quiz":{"question":"What might be a useful first move on an overlooked idea?","choices":["Wait for a complete plan","Run a small experiment","Ignore it until it becomes popular"],"answer":1,"explanation":"Small exploratory work gives feedback before committing to a large plan."}},{"id":"leverage-points","title":"Changing a system's rules can beat tuning its numbers","kicker":"Where change really happens","hook":"Some interventions move a dial; others rewrite what the dial does.","type":"Essay","category":"Science","author":"Donella Meadows","source_title":"Leverage Points: Places to Intervene in a System","source_url":"https://donellameadows.org/archives/leverage-points-places-to-intervene-in-a-system/","year":1999,"minutes":4,"art":"deepblue","summary":"In complex systems, changing feedback, information flows, goals or rules can be more consequential than changing a single numerical parameter.","body":["Consider a system that repeatedly produces the same bad outcome. Increasing a budget or changing one threshold might help, but often leaves the basic behavior intact.","Donella Meadows proposes a hierarchy of places to intervene in systems. Parameters are relatively shallow interventions. Rules, goals and the mindsets behind them can be deeper ones.","The useful question becomes: What mechanism keeps reproducing the outcome? Changing that mechanism may matter more than treating each symptom."],"takeaways":["Look for feedback loops and incentives before adjusting parameters.","Information flows can be powerful intervention points.","System goals and rules shape recurring behavior."],"nuance":"Meadows explicitly presents her ranking as tentative and context dependent, not a mechanical formula.","application":"Choose one recurring problem at work. Identify the feedback loop or incentive that keeps it alive.","quiz":{"question":"Which change is usually deeper in Meadows' framing?","choices":["Changing a threshold from 7 to 8","Changing the system's governing incentives","Renaming a dashboard"],"answer":1,"explanation":"Rules and incentives can alter how the system behaves, not just its current operating point."}},{"id":"the-tail-end","title":"You may have fewer ordinary moments left than you think","kicker":"An unsettling way to count time","hook":"What if you counted future dinners with someone, not years left to live?","type":"Essay","category":"Life","author":"Tim Urban","source_title":"The Tail End","source_url":"https://waitbutwhy.com/2015/12/the-tail-end.html","year":2015,"minutes":3,"art":"rose","summary":"Because time with loved ones becomes less frequent as circumstances change, the number of future shared moments can be surprisingly limited.","body":["We tend to imagine relationships as stretching across many future years. But the number of days we actually spend together can change dramatically after moving out, changing jobs or relocating.","Tim Urban uses simple visual arithmetic to reframe the question: how many visits, weekends or ordinary meals might remain?","The point is not to predict an exact count. It is to recognize that attention and proximity are decisions, and that 'someday' is not a neutral plan."],"takeaways":["Think in shared occasions, not only years.","Frequency of contact changes the time you actually have.","Priorities shape how much remaining time you share."],"nuance":"The numbers in the original essay are personal illustrations, not population-level forecasts.","application":"Choose one person you'd like to see more. Put a specific visit or call on the calendar.","quiz":{"question":"What does the 'tail end' reframe emphasize?","choices":["Predicting your lifespan precisely","The number of actual future shared occasions","Avoiding all long-term plans"],"answer":1,"explanation":"The essay measures relationship time in shared experiences, which may be much scarcer than years suggest."}},{"id":"lost-middle","title":"Long context does not guarantee long memory","kicker":"A blind spot in language models","hook":"The same evidence can matter less depending on where it appears.","type":"Paper","category":"Technology","author":"Nelson F. Liu et al.","source_title":"Lost in the Middle: How Language Models Use Long Contexts","source_url":"https://aclanthology.org/2024.tacl-1.9/","year":2024,"minutes":4,"art":"blue","summary":"In the studied long-context tasks, language-model performance often dropped when relevant information was placed in the middle rather than near the beginning or end.","body":["A model can accept a long input without using every part equally well. Liu and colleagues evaluated question answering and key-value retrieval while varying where relevant evidence appeared.","They observed a recurring position effect: performance was often better when information was near the beginning or end of context and weaker when it was in the middle.","The work motivates testing not only whether a document fits in a context window, but whether a model reliably retrieves information from different locations within it."],"takeaways":["Context capacity and effective context use are distinct.","Evidence position can influence performance.","Long-context evaluations should test positional robustness."],"nuance":"This is a finding in the evaluated models and tasks; it should not be treated as an invariant law of all newer models.","application":"When evaluating an agent, insert identical key facts at different transcript positions and measure answer stability.","quiz":{"question":"What did the paper primarily show?","choices":["Models cannot process long inputs","Information position can affect retrieval performance","All prompts must be short"],"answer":1,"explanation":"Position-dependent performance was the key experimental observation."}},{"id":"weak-ties","title":"Your acquaintances can connect entire worlds","kicker":"The surprising value of weak ties","hook":"The most useful new information may come from someone you barely know.","type":"Paper","category":"Society","author":"Mark S. Granovetter","source_title":"The Strength of Weak Ties","source_url":"https://doi.org/10.1086/225469","year":1973,"minutes":4,"art":"peach","summary":"Weak social ties can bridge otherwise separate groups and carry information across communities in ways close relationships often cannot.","body":["Close friends frequently know the same people and encounter overlapping information. An acquaintance may move in a different social circle.","Granovetter's influential network-theory paper explains why those weaker connections can bridge groups and help information, opportunities and influence travel through a society.","The insight is structural: a tie can be valuable not because it is emotionally close, but because it connects parts of a network that are otherwise distant."],"takeaways":["Strong ties often reinforce local cohesion.","Weak ties can bridge distinct communities.","Network position matters alongside relationship strength."],"nuance":"The paper develops a sociological theory; individual outcomes depend on context and cannot be guaranteed from any single weak tie.","application":"Reach out to someone outside your usual professional or social circle and ask what they are learning.","quiz":{"question":"Why can weak ties transmit novel information?","choices":["Acquaintances always know more","They may connect less-overlapping networks","Close friends never share information"],"answer":1,"explanation":"Bridges between communities can expose people to information outside their immediate circle."}},{"id":"testing-effect","title":"Remembering is itself a form of learning","kicker":"The science of recall","hook":"A short quiz can strengthen memory more than another reread.","type":"Paper","category":"Science","author":"Henry L. Roediger III & Jeffrey D. Karpicke","source_title":"Test-Enhanced Learning: Taking Memory Tests Improves Long-Term Retention","source_url":"https://www.psychologicalscience.org/journals/psychological-science/j.1467-9280.2006.01693.x/","year":2006,"minutes":3,"art":"mint","summary":"In experiments using prose passages, retrieval practice improved delayed retention compared with repeated studying, even without feedback during the retrieval attempts.","body":["Rereading a paragraph can feel fluent, but that feeling is not the same as being able to recover the idea later.","Roediger and Karpicke compared repeated studying with trying to recall studied material. On later tests after delays, retrieval practice improved retention relative to restudying in their experiments.","This provides a practical reason for a learning app to ask a thoughtful question after each idea, rather than simply offering endless content."],"takeaways":["Retrieving knowledge can improve its later accessibility.","Confidence from rereading can be misleading.","A brief recall attempt can be worth the added effort."],"nuance":"Study conditions, delay intervals and material type affect effect sizes; it is not true that testing always beats studying in every condition.","application":"After reading an idea, close the article and explain it in one or two sentences from memory.","quiz":{"question":"Why include a recall question after an insight?","choices":["To make reading take longer","Retrieval practice may improve delayed retention","Because all quizzes are equally helpful"],"answer":1,"explanation":"Trying to retrieve information is itself a learning activity, according to the testing-effect literature."}},{"id":"bitter-lesson","title":"Why general methods keep beating clever handcrafting","kicker":"The bitter lesson of AI","hook":"A method that scales with computation can eventually surpass one built from expert tricks.","type":"Essay","category":"Technology","author":"Richard Sutton","source_title":"The Bitter Lesson","source_url":"http://www.incompleteideas.net/IncIdeas/BitterLesson.html","year":2019,"minutes":4,"art":"lavender","summary":"Sutton argues that AI approaches able to leverage increasing computation through general search and learning have historically outperformed domain-specific hand-engineered knowledge over the long run.","body":["It is tempting to make an AI system stronger by encoding the human expert's hard-won knowledge directly into it.","Richard Sutton points to several historical episodes in AI where scalable general methods, especially search and learning, ultimately improved faster as compute became abundant.","The lesson is about long-run scaling trends, not a claim that domain expertise is useless in contemporary engineering."],"takeaways":["Scalability with compute can matter more than hand-tuned sophistication.","General learning and search methods transfer across domains.","Short-term engineering gains and long-term trends need not align."],"nuance":"This is an influential interpretive essay, not a theorem or a controlled meta-analysis of all AI systems.","application":"In a system you're designing, identify which gains come from generic scaling and which require manual domain assumptions.","quiz":{"question":"What is the essay's central historical claim?","choices":["Expert rules are always best","General learning/search methods often gain more from scaling compute","Compute use should be minimized"],"answer":1,"explanation":"The essay favors general methods that continue improving with available computation."}}];
</script>
<script src="reader.js"></script>
<script>
(function(){'use strict';
const DATA=Array.isArray(window.SIFT_IDEAS)?window.SIFT_IDEAS:[];
const icons={compass:'<circle cx="12" cy="12" r="9"/><path d="m16 8-2.4 5.6L8 16l2.4-5.6z"/>',library:'<path d="M4 4h5v16H4zM9 5h5v15H9zM16 4h4v16h-4z"/>',bookmark:'<path d="M6 4.5h12v16l-6-4-6 4z"/>',chart:'<path d="M3 20h18M6 16v-5m6 5V5m6 11V9"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',spark:'<path d="m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8z"/>'};
const svg=(name,size=20)=>`<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[name]||icons.spark}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=url=>{try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:'#';}catch{return '#'}};
function store(key,fallback){try{let v=JSON.parse(localStorage.getItem('sift_'+key));return v??fallback}catch{return fallback}};
let saved=new Set(store('saved',[])),read=store('read',{}),quizzes=store('quizzes',{});
let state={nav:'discover',type:'All',topic:'All',search:'',opened:null};
function persist(){try{localStorage.setItem('sift_saved',JSON.stringify([...saved]));localStorage.setItem('sift_read',JSON.stringify(read));localStorage.setItem('sift_quizzes',JSON.stringify(quizzes));}catch{}}
const id=id=>DATA.find(x=>x.id===id);
const completedCount=()=>DATA.filter(x=>!!read[x.id]).length;
const percent=()=>Math.round(completedCount()/Math.max(DATA.length,1)*100);
const navs=[['discover','Discover','compass'],['library','Unread','library'],['saved','Saved','bookmark'],['completed','Completed','check']];
function renderNav(){
 const n=completedCount();
 const html=navs.map(([key,label,ico])=>`<button class="nav-btn ${state.nav===key?'active':''}" data-nav="${key}" aria-current="${state.nav===key?'page':'false'}">${svg(ico)}<span>${label}</span>${key==='saved'?`<span class="nav-count">${saved.size}</span>`:key==='completed'?`<span class="nav-count">${n}</span>`:''}</button>`).join('');
 document.getElementById('desktop-nav').innerHTML=html;
 document.getElementById('mobile-nav').innerHTML=navs.map(([key,label,ico])=>`<button class="mobile-tab ${state.nav===key?'active':''}" data-nav="${key}" aria-label="${label}" aria-current="${state.nav===key?'page':'false'}">${svg(ico,21)}<span>${label}</span></button>`).join('');
}
function getFiltered(){let list=DATA.filter(x=>state.type==='All'||x.type===state.type).filter(x=>state.topic==='All'||x.category===state.topic).filter(x=>state.nav==='saved'?saved.has(x.id):state.nav==='completed'?!!read[x.id]:!read[x.id]);let term=state.search.trim().toLowerCase();if(term)list=list.filter(x=>[x.title,x.hook,x.summary,x.category,x.author,x.source_title].some(v=>String(v).toLowerCase().includes(term)));return list;}
function getFeatured(){let day=Math.floor(new Date().getTime()/86400000),unread=DATA.filter(x=>!read[x.id]);return unread.length?unread[(day%unread.length+unread.length)%unread.length]:null}
function filters(){let topics=[...new Set(DATA.map(x=>x.category))].sort();return `<div class="filters" aria-label="Filter sources">${['All','Book','Essay','Paper'].map(t=>`<button class="filter-btn ${state.type===t?'selected':''}" data-type="${t}">${t==='All'?'All sources':t==='Book'?'Books':t==='Essay'?'Essays & blogs':'Papers'}</button>`).join('')}<span class="filter-sep"></span>${['All',...topics].map(t=>`<button class="filter-btn ${state.topic===t?'selected':''}" data-topic="${esc(t)}">${t==='All'?'All topics':esc(t)}</button>`).join('')}</div>`}
function card(x,i){let symbol=['✳','✦','◌','↗','∿','◎','⌁','✺','⌘','◇','✸','✽'][(DATA.indexOf(x)+12)%12];return `<article class="card"><div class="card-art ${esc(x.art)}">${read[x.id]?'<span class="card-status">✓ Read</span>':''}<span class="art-graphic" aria-hidden="true">${symbol}</span><span class="art-mini">${esc(x.category)}</span><button aria-label="${saved.has(x.id)?'Remove from saved':'Save idea'}" aria-pressed="${saved.has(x.id)}" class="save-btn ${saved.has(x.id)?'saved':''}" data-save="${esc(x.id)}">${svg('bookmark',17)}</button></div><div class="card-body"><div class="card-meta"><span class="type-dot ${esc(x.type)}"></span>${esc(x.type)} <span>·</span> ${x.minutes} min read</div><h3 class="card-title">${esc(x.title)}</h3><p class="card-desc">${esc(x.hook)}</p><div class="card-foot"><span class="card-source" title="${esc(x.source_title)}">${esc(x.author)}</span><button class="read-link" data-open="${esc(x.id)}">Read idea ${svg('arrow',14)}</button></div></div></article>`}
function empty(message,action='Browse unread',nav='library'){return `<div class="empty"><span class="big">✳</span><h2>Nothing here yet.</h2><p>${esc(message)}</p><button class="primary-btn" data-nav="${nav}">${esc(action)} ${svg('arrow',16)}</button></div>`}
function renderDiscover(){
 let featured=getFeatured(),arr=getFiltered(),allDone=!featured&&DATA.length>0;
 let featuredHTML=state.nav==='discover'&&!state.search?
   (featured?`<section class="hero"><div class="hero-content"><span class="eyebrow">✳&nbsp; TODAY'S SMALL WONDER</span><h2 class="hero-title">${esc(featured.title)}</h2><p class="hero-desc">${esc(featured.summary)}</p><div class="hero-bottom"><button class="primary-btn" data-open="${esc(featured.id)}">Explore this idea ${svg('arrow',15)}</button><span class="hero-meta">${esc(featured.type)} · ${featured.minutes} min</span></div></div><div class="hero-art" aria-hidden="true"><div class="orb"></div><span class="art-word">wonder</span></div></section>`:
   `<section class="hero"><div class="hero-content"><span class="eyebrow">✳&nbsp; ALL CAUGHT UP</span><h2 class="hero-title">You've read them all.</h2><p class="hero-desc">New ideas will appear here as they're published. Your completed collection is ready whenever you want to revisit it.</p><div class="hero-bottom"><button class="primary-btn" data-nav="completed">View completed ${svg('arrow',15)}</button></div></div><div class="hero-art" aria-hidden="true"><div class="orb"></div><span class="art-word">wonder</span></div></section>`):'';
 let h=state.nav==='discover'?
   `<section class="section-head"><span class="eyebrow">A PERSONAL LIBRARY OF CURIOSITY</span><h1 class="display">A little more <em>curious,</em><br>every day.</h1><p class="intro">Fresh ideas worth keeping, distilled from books, essays, and research. Completed ideas move to their own shelf.</p></section>`:
   `<section class="section-head"><span class="eyebrow">STORIES YOU HAVEN'T FINISHED</span><h1>Unread ideas.</h1><p>${DATA.length-completedCount()} ideas left to explore. Completed ideas are kept in their own tab.</p></section>`;
 let bar=`<div class="section-bar"><div><h2>${state.search?'Search results':state.nav==='discover'?'Explore something new':'Your unread collection'} <span class="count">${arr.length}</span></h2><p>Small reads. Big rabbit holes.</p></div>${state.nav==='discover'?'<button class="small-link" data-nav="library">View all unread →</button>':''}</div>`;
 let noItems=allDone?empty("You've completed every available idea. New stories will show up here when published.",'Review completed','completed'):empty('Try a different source, topic, or search.','Show all unread','library');
 return h+featuredHTML+bar+filters()+(arr.length?`<div class="cards">${arr.map(card).join('')}</div>`:noItems);
}
function renderSaved(){let items=getFiltered();return `<section class="section-head"><span class="eyebrow">COLLECT WHAT RESONATES</span><h1>Your saved ideas.</h1><p>Keep a shelf of ideas you'd like to return to.</p></section>`+filters()+(items.length?`<div class="cards">${items.map(card).join('')}</div>`:empty('Bookmark an idea to keep it on this shelf.'))}
function renderCompleted(){
 let n=completedCount(),items=getFiltered().slice().sort((a,b)=>String(read[b.id]||'').localeCompare(String(read[a.id]||''))),q=Object.keys(quizzes).length;
 let types=['Book','Essay','Paper'];
 let tiles=`<div class="stats"><div class="stat"><span class="stat-icon">${svg('library')}</span><strong>${n}</strong><span>Ideas finished</span></div><div class="stat"><span class="stat-icon">${svg('bookmark')}</span><strong>${saved.size}</strong><span>Saved ideas</span></div><div class="stat"><span class="stat-icon">${svg('check')}</span><strong>${q}</strong><span>Recall questions tried</span></div></div>`;
 let groups=types.map(t=>{let all=DATA.filter(x=>x.type===t),done=all.filter(x=>read[x.id]).length,p=Math.round(100*done/Math.max(all.length,1));return `<div class="collection-row"><div><strong>${t==='Book'?'Books':t==='Essay'?'Essays & blogs':'Papers'}</strong><br><span>${done} of ${all.length} read</span></div><div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div></div>`}).join('');
 let header=`<section class="section-head"><span class="eyebrow">YOUR COMPLETED COLLECTION</span><h1>Completed ideas.</h1><p>${n} of ${DATA.length} ideas finished. Revisit anything here, or mark it unread to move it back.</p></section>`;
 let section=`<div class="section-bar"><div><h2>${state.search?'Search results':'Finished stories'} <span class="count">${items.length}</span></h2><p>Most recently completed first.</p></div></div>`;
 let shelf=items.length?`<div class="cards">${items.map(card).join('')}</div>`:empty(n?'No completed ideas match these filters.':'When you mark an idea as read, it will appear here.','Explore unread ideas','library');
 let stats=`<details class="completion-stats"><summary>Reading statistics</summary>${tiles}<div class="section-bar"><h2>Reading by source</h2></div>${groups}</details>`;
 return header+section+filters()+shelf+stats;
}
function render(){renderNav();let c=document.getElementById('content');c.innerHTML=state.nav==='completed'?renderCompleted():state.nav==='saved'?renderSaved():renderDiscover();document.getElementById('footer-count').textContent=`${DATA.length} sourced ideas · starter edition`;const inp=document.getElementById('search');if(inp&&inp.value!==state.search)inp.value=state.search;}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>t.style.display='none',2200)}
function openIdea(x){if(!x)return;if(window.SIFT_SLIDES){state.opened=x.id;window.SIFT_SLIDES.open(x,{saved:saved.has(x.id),read:!!read[x.id],quiz:quizzes[x.id]});document.body.style.overflow='hidden';return;}state.opened=x.id;const result=quizzes[x.id];const quizOptions=x.quiz.choices.map((a,i)=>`<button class="quiz-choice ${result===undefined?'':i===x.quiz.answer?'correct':i===result?'incorrect':''}" ${result!==undefined?'disabled':''} data-quiz="${esc(x.id)}" data-choice="${i}">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('');
 const html=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close" aria-label="Close" data-close="true">${svg('close',20)}</button><div class="modal-top"><span class="modal-label">${esc(x.type)} · ${esc(x.category)} · ${x.minutes} minute read</span><h2 id="modal-title">${esc(x.title)}</h2><p class="modal-hook">${esc(x.hook)}</p><div class="modal-byline">Inspired by ${esc(x.source_title)} <span>·</span> ${esc(x.author)} <span>·</span> ${x.year}</div></div><div class="modal-body">${x.body.map(p=>`<p>${esc(p)}</p>`).join('')}<h3>Ideas worth keeping</h3><ul class="takeaway-list">${x.takeaways.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><div class="nuance"><span class="inline-heading">⚖ THE NUANCE</span>${esc(x.nuance)}</div><div class="apply"><span class="inline-heading">✳ TRY THIS</span>${esc(x.application)}</div><div class="quiz"><span class="eyebrow">ONE-MINUTE RECALL</span><h3>${esc(x.quiz.question)}</h3>${quizOptions}${result!==undefined?`<p class="quiz-feedback"><strong>${result===x.quiz.answer?'Nice work!':'Worth another look.'}</strong> ${esc(x.quiz.explanation)}</p>`:''}</div><div class="source-card"><div><span class="source-label">ORIGINAL SOURCE</span><strong>${esc(x.source_title)}</strong><span style="font-size:11px;color:#898c83">${esc(x.author)} · ${esc(x.type)}</span></div><a href="${esc(safeUrl(x.source_url))}" target="_blank" rel="noopener noreferrer" aria-label="Open original source in a new tab">Open source ↗</a></div><div class="modal-actions"><button class="primary-btn" data-read="${esc(x.id)}">${svg('check',16)} ${read[x.id]?'Read ✓':'Mark as read'}</button><button class="secondary-btn" data-save="${esc(x.id)}">${saved.has(x.id)?'★ Saved':'☆ Save idea'}</button><button class="secondary-btn" data-share="${esc(x.id)}">Share ↗</button></div></div></section></div>`;
 document.getElementById('modal-root').innerHTML=html;document.body.style.overflow='hidden';document.querySelector('.close').focus();}
function refreshModal(){const old=document.querySelector('.modal');const y=old?old.scrollTop:0;const focused=document.activeElement?.dataset?.quiz?document.activeElement.dataset.choice:null;openIdea(id(state.opened));const now=document.querySelector('.modal');if(now)now.scrollTop=y;}
function closeModal(){if(window.SIFT_SLIDES)window.SIFT_SLIDES.close();state.opened=null;document.getElementById('modal-root').innerHTML='';document.body.style.overflow=''}
document.addEventListener('click',async function(e){const btn=e.target.closest('[data-nav],[data-type],[data-topic],[data-open],[data-save],[data-read],[data-quiz],[data-close],[data-reset],[data-share]');if(!btn){if(e.target.id==='backdrop')closeModal();return;}if(btn.tagName==='A')e.preventDefault();if(btn.dataset.nav){state.nav=btn.dataset.nav;state.search='';state.type='All';state.topic='All';render();window.scrollTo({top:0,behavior:'smooth'});return;}
 if(btn.dataset.type){state.type=btn.dataset.type;render();return;}if(btn.dataset.topic){state.topic=btn.dataset.topic;render();return;}if(btn.dataset.reset){state.nav='library';state.type='All';state.topic='All';state.search='';render();return;}if(btn.dataset.open){openIdea(id(btn.dataset.open));return;}if(btn.dataset.close){closeModal();return;}
 if(btn.dataset.save){let k=btn.dataset.save;if(saved.has(k)){saved.delete(k);toast('Removed from saved ideas')}else{saved.add(k);toast('Saved for later ✳')}persist();render();if(state.opened)refreshModal();return;}
 if(btn.dataset.read){const k=btn.dataset.read,wasRead=!!read[k];if(wasRead)delete read[k];else read[k]=new Date().toISOString();persist();render();if(state.opened)refreshModal();toast(wasRead?'Moved back to Unread':'Moved to Completed');return;}
 if(btn.dataset.quiz){const key=btn.dataset.quiz;if(quizzes[key]!==undefined)return;quizzes[key]=Number(btn.dataset.choice);persist();if(state.opened)refreshModal();toast(quizzes[key]===id(key).quiz.answer?'Correct — nicely done!':'Good attempt — keep learning');return;}
 if(btn.dataset.share){const x=id(btn.dataset.share),url=safeUrl(x.source_url),msg=`${x.title} — a short insight from ${x.source_title}: ${url}`;if(navigator.share){try{await navigator.share({title:x.title,text:msg,url})}catch{}}else if(navigator.clipboard){try{await navigator.clipboard.writeText(msg);toast('Source link copied')}catch{toast('Open source to share the link')}}else{toast('Open source to share the link')}return;}
});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.opened)closeModal()});document.getElementById('search').addEventListener('input',e=>{state.search=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('search');next.focus();try{next.setSelectionRange(pos,pos)}catch{}});
const today=new Date();document.getElementById('today').textContent=new Intl.DateTimeFormat('en',{weekday:'long',month:'long',day:'numeric'}).format(today).toUpperCase();render();
})();
</script>
</body>
</html>
