name: Publish Sift
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/ideas.json'
      - 'scripts/sync_data.py'
      - 'reader.js'
      - 'reader.css'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sift-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Validate slide content and reader syntax
        run: |
          node --check reader.js
          python -m py_compile scripts/sync_data.py
          python scripts/sync_data.py
          grep -q 'reader.js' index.html
          grep -q 'reader.css' index.html
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp reader.js _site/reader.js
          cp reader.css _site/reader.css
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
